# Publishes the browser version of Ship's Log (the src/ folder, as is) to
# GitHub Pages every time main is pushed:
#   https://dgmcint.github.io/Ships-Log/
#
# One-time setup on GitHub: Settings → Pages → Source: "GitHub Actions".
#
# On an iPhone: open that address in Safari, tap Share, then "Add to Home
# Screen". It then opens full-screen like an app and works offline.

name: Pages

on:
  push:
    branches: [main]
    paths: ["src/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
