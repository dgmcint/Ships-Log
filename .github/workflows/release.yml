# Builds one install file per desktop system and attaches them to a draft
# GitHub release:
#   macOS    Ship's Log_<version>_universal.dmg   (Apple Silicon and Intel)
#   Windows  Ship's Log_<version>_x64-setup.exe   (installs without admin rights)
#   Linux    Ship's Log_<version>_amd64.AppImage  (runs without installing)
#   Windows  Ships-Log-<version>-windows-portable.zip (portable: runs from any folder or USB drive)
#
# To release: update "version" in src-tauri/tauri.conf.json, commit and push, then
# either press "Run workflow" on the Actions tab (Release workflow), or push a tag:
#   git tag v0.1.0 && git push origin v0.1.0
# The release is named after the version in tauri.conf.json.
# When the three builds finish, review the draft release on GitHub and publish it.

name: Release

on:
  push:
    tags: ["v*"]
  # Adds a "Run workflow" button on the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The universal Mac app needs both Apple Silicon and Intel.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Ship's Log v__VERSION__"
          releaseBody: |
            **Download the file for your computer:**
            - **Mac** (Apple Silicon and Intel): the `.dmg` file. Open it and drag Ship's Log to Applications.
            - **Windows**: the `-setup.exe` file. No administrator rights needed.
            - **Linux**: the `.AppImage` file. Make it executable (`chmod +x`) and run it; nothing to install.
            - **Portable Windows** (USB drive): the `windows-portable.zip` file. Unzip it anywhere and run `Ships Log.exe`; your log stays in the `Ships Log Data` folder beside it.
            - **Portable Mac or Linux**: put the app (or AppImage) in a folder with an empty folder named `Ships Log Data` beside it, or use Settings > Make portable.

            Until the app is signed, macOS and Windows may warn the first time you open it. On a Mac, right-click the app and choose Open. On Windows, choose More info, then Run anyway.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Portable Windows copy: the program plus an empty "Ships Log Data" folder, zipped.
      - name: Make the portable Windows zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path "portable/Ships Log/Ships Log Data" | Out-Null
          Copy-Item src-tauri/target/release/ships-log.exe "portable/Ships Log/Ships Log.exe"
          Set-Content "portable/Ships Log/Ships Log Data/README.txt" "Ship's Log keeps your log in this folder. Keep it next to Ships Log.exe."
          Compress-Archive -Path "portable/Ships Log" -DestinationPath "Ships-Log-$version-windows-portable.zip"
          "ZIP=Ships-Log-$version-windows-portable.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Attach the portable zip to the release
        if: matrix.platform == 'windows-latest'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number("${{ steps.tauri.outputs.releaseId }}"),
              name: process.env.ZIP,
              data: fs.readFileSync(process.env.ZIP),
            });
