<!doctype html>
<html lang="en" data-skin="console">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ship's Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Exo+2:ital,wght@1,700;1,800;1,900&family=Oxanium:wght@400;600;700&family=Share+Tech+Mono&family=Lora:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="skins.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="bar" aria-hidden="true">
      <span class="cap"></span><span id="bar-label" class="bar-label">Ship's Log</span><span class="fill"></span><span class="end"></span>
    </div>

    <main id="screen" class="screen" aria-live="polite"></main>

    <div class="bar bottom" aria-hidden="true">
      <span class="cap"></span><span class="fill"></span><span class="end"></span>
    </div>

    <nav class="nav" aria-label="Main">
      <button type="button" data-go="logs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6"/></svg>
        <span>Logs</span>
      </button>
      <button type="button" data-go="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
        <span>Search</span>
      </button>
      <button type="button" data-go="crew">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 15c3 0 5 2 5 5"/></svg>
        <span>Crew</span>
      </button>
      <button type="button" data-go="map">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18M3 12h18"/></svg>
        <span>Map</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
